# Checks that need no runtime build (the WASM runtime build takes ~4 min and needs
# Emscripten; run `scripts/build-runtime-source.sh` + `npm run build` + `npm run verify:dist`
# before deploying, see docs/deployment.md).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node scripts/verify.mjs
      - run: npm run test:unit
      - run: npm run test:host
